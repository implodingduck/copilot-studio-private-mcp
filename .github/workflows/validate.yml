name: Validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run format:check && npm test && npm run build
      - run: bash -n scripts/deploy.sh
      - run: docker build -t support-tickets:test .
      - name: Verify container startup and default authentication
        run: |
          container_id="$(docker run --detach --rm --publish 127.0.0.1:8080:8080 \
            --env ALLOWED_HOSTS=127.0.0.1:8080 \
            --env ENTRA_TENANT_ID=11111111-1111-4111-8111-111111111111 \
            --env ENTRA_API_CLIENT_ID=22222222-2222-4222-8222-222222222222 \
            --env ENTRA_CONNECTOR_CLIENT_ID=33333333-3333-4333-8333-333333333333 \
            support-tickets:test)"
          trap 'docker stop "$container_id"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail \
            http://127.0.0.1:8080/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8080/mcp)" = 401
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false -input=false
        working-directory: terraform
      - run: terraform validate && terraform test
        working-directory: terraform
